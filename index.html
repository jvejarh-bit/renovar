<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metanoia</title>
<meta name="description" content="Self-Talk Log: renovar el entendimiento reemplazando los pensamientos falsos por la verdad (Romanos 12:2).">
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Metanoia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  /* Plan: una sola columna tranquila, como una libreta. Lo viejo va en tinta gris con borde punteado;
     lo verdadero, en el verde de un sendero nuevo y en letra serif. */
  --bg:#F1F4F2;
  --surface:#FFFFFF;
  --ink:#15231E;
  --muted:#5A6A64;
  --line:#D6DFDA;
  --accent:#2B6A4D;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0EDE6;
  --old:#73685F;
  --danger:#A3392A;
  --danger-soft:#F6E6E2;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-truth:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211C; --ink:#E4EDE8; --muted:#93A59D; --line:#273631;
    --accent:#7CC29E; --accent-ink:#0B1310; --accent-soft:#1A3026;
    --old:#B5A99F; --danger:#E8877A; --danger-soft:#3A1F1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211C; --ink:#E4EDE8; --muted:#93A59D; --line:#273631;
  --accent:#7CC29E; --accent-ink:#0B1310; --accent-soft:#1A3026;
  --old:#B5A99F; --danger:#E8877A; --danger-soft:#3A1F1A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--font-ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
p{margin:0}

.app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 36px) max(16px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#main{display:flex;flex-direction:column;gap:20px}

/* encabezados */
.top{display:grid;gap:4px}
.eyebrow{font:600 13px/1.3 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
h1{font:700 30px/1.12 var(--font-ui);letter-spacing:-.015em;margin:0;text-wrap:balance}
/* título de la portada: siempre en una sola línea, se achica según el ancho del teléfono */
.h1-app{white-space:nowrap;font-size:clamp(18px,6.2vw,32px);letter-spacing:-.02em}
.lead{color:var(--muted);font-size:16px;max-width:60ch}
.sec-h{font:600 13px/1.3 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;font:600 17px/1.1 var(--font-ui);border:1px solid transparent;cursor:pointer;text-decoration:none;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost.danger{color:var(--danger)}
.btn-sm{min-height:40px;font-size:15px;padding:0 14px}
.btn-block{width:100%}
.btn svg{width:20px;height:20px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hidden{display:none!important}

/* avisos */
.banner{display:grid;gap:10px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);font-size:16px}
.banner.warn{background:var(--danger-soft)}
.banner strong{display:block;margin-bottom:2px}
.banner-actions{display:flex;gap:18px;flex-wrap:wrap}

/* semana */
.week{display:grid;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.week-sum{font-size:15px;color:var(--muted)}
.week-sum strong{color:var(--ink);font-variant-numeric:tabular-nums}
.week-days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week-days li{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd{font:600 12px/1 var(--font-ui);color:var(--muted);text-transform:uppercase}
.wn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--line);font:600 14px/1 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--muted)}
.week-days li.on .wn{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink)}
.week-days li.today .wd{color:var(--ink)}

/* búsqueda */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px;color:var(--muted)}
.search:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.search svg{width:20px;height:20px}
.search input{border:0;background:transparent;flex:1;font:17px var(--font-ui);color:var(--ink);min-height:46px;outline:none;min-width:0}

/* lista de registros */
.group{display:grid;gap:8px}
.group-h{font:600 15px/1.3 var(--font-ui);margin:0}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rows > li + li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:46px 1fr auto 18px;gap:10px;align-items:start;width:100%;padding:14px 12px 14px 14px;background:none;border:0;text-align:left;cursor:pointer}
.row-time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.row-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.row-old{font-size:15px;line-height:1.4;color:var(--old);padding-left:10px;border-left:2px dotted var(--old);overflow-wrap:anywhere}
.row-new{font:400 18px/1.35 var(--font-truth);padding-left:10px;border-left:3px solid var(--accent);overflow-wrap:anywhere}
.row-new.pending{font:600 13px/1.2 var(--font-ui);color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:5px 10px;align-self:flex-start}
.row-rep{font:600 13px/1 var(--font-ui);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 8px;font-variant-numeric:tabular-nums}
.row > svg{width:18px;height:18px;color:var(--muted);align-self:center}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

/* ejemplo */
.example{display:grid;gap:14px;padding:16px;border:1px dashed var(--muted);border-radius:var(--r)}
.tag{justify-self:start;font:700 12px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--surface)}
.ex-cols{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ex-cols li{display:grid;grid-template-columns:26px 1fr;gap:8px}
.ex-n{font:400 20px/1.2 var(--font-truth);color:var(--muted)}
.ex-l{display:block;font:600 12px/1.3 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ex-cols .old{color:var(--old)}
.ex-cols .truth{font-family:var(--font-truth);font-size:19px;line-height:1.35}

/* detalle */
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--accent);font:500 17px var(--font-ui);padding:8px 0;margin-left:-6px;cursor:pointer;justify-self:start}
.cols{display:grid;gap:10px}
.col{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.col-n{font:400 28px/1 var(--font-truth);color:var(--muted)}
.col h3{margin:0;font:600 13px/1.3 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.col-b{display:grid;gap:10px;min-width:0;overflow-wrap:anywhere}
.col .old{color:var(--old);font-size:19px;line-height:1.4}
.col .none{color:var(--muted);font-style:italic;font-size:15px}
.col-truth{background:var(--accent-soft);border-color:transparent}
.col-truth .col-n{color:var(--accent)}
.col-truth h3{color:var(--accent)}
.truth{font:400 22px/1.35 var(--font-truth)}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{font:600 14px/1.2 var(--font-ui);color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:999px;text-decoration:none}
.col-truth .ref{background:var(--surface)}
.again{display:grid;gap:10px}
.again-note{color:var(--muted);font-size:15px}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@keyframes flash{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}to{box-shadow:0 0 0 16px transparent}}
.flash{animation:flash .9s ease-out}

/* verdades */
.truth-groups{display:grid;gap:10px}
.truth-group{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.truth-group > summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:600;font-size:17px;display:flex;align-items:center;gap:10px}
.truth-group > summary::-webkit-details-marker{display:none}
.truth-group > summary span:first-child{flex:1}
.truth-group > summary .count{font:600 13px/1 var(--font-ui);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 8px}
.truth-group > summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
.truth-group[open] > summary::after{content:"–"}
.truth-group .truths{border:0;border-top:1px solid var(--line);border-radius:0}
.truths{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.truths > li{display:grid;gap:10px;padding:16px;border-left:4px solid var(--accent)}
.truths > li + li{border-top:1px solid var(--line)}
.truths.guide > li{border-left-color:var(--line)}
.truth-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:15px}
.truth-meta .link{font-size:15px}
.truths .truth{font-size:20px}

/* enviar */
.seg{border:0;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;font-weight:500;cursor:pointer;min-height:52px}
.opt input{accent-color:var(--accent);width:20px;height:20px;margin:0;flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:disabled){opacity:.5;cursor:default}
.send-sum{font-size:16px}
.send-sum strong{font-variant-numeric:tabular-nums}
.preview{white-space:pre-wrap;font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:320px;overflow:auto;margin:0;overflow-wrap:anywhere}
.stack{display:grid;gap:10px}
.muted{color:var(--muted);font-size:15px}

/* ajustes */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.panel h2{margin:0;font:600 19px/1.25 var(--font-ui)}
.panel.urgent{border-left:4px solid var(--danger)}
.fld{display:grid;gap:6px}
.fld > span{font:600 14px/1.3 var(--font-ui);color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=search],input[type=datetime-local],select,textarea{font:17px/1.4 var(--font-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent)}
.lines{list-style:none;margin:0;padding:0;display:grid}
.lines li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.lines li:first-child{border-top:0}
.lines a{font:700 17px/1 var(--font-ui);white-space:nowrap;text-decoration:none;font-variant-numeric:tabular-nums}
.steps-ol{margin:0;padding-left:22px;display:grid;gap:8px;font-size:16px}
.cloud-ok{color:var(--accent);font-weight:600}
.cloud-err{color:var(--danger);font-weight:600}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{color:var(--muted);font-size:13px;text-align:center}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;color:var(--muted);text-decoration:none;font:600 11px/1.2 var(--font-ui)}
.tabbar a[aria-current="page"]{color:var(--accent)}

/* editor */
#editor{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
body.editing #editor{display:block}
body.editing #app,body.editing .tabbar{display:none}
.ed{max-width:600px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
/* barra superior del editor: fondo sólido para que no se mezcle con la barra de estado ni con el texto al hacer scroll */
.ed-bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 18px -14px rgba(0,0,0,.45);padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.ed-top{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;min-height:44px}
.ed-cancel{justify-self:start;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px/1 var(--font-ui);cursor:pointer}
.ed-cancel svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.ed-title{margin:0;font:700 18px/1.2 var(--font-ui);color:var(--ink);text-align:center;white-space:nowrap}
@media (max-width:360px){.ed-title{font-size:16px}.ed-cancel{padding:0 10px;font-size:14px}.ed-count{font-size:13px;padding:6px 9px}}
.ed-count{justify-self:end;margin:0;padding:7px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 14px/1 var(--font-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{display:flex;flex-direction:column;gap:6px;width:100%;padding:4px 0;background:none;border:0;text-align:left;color:var(--muted);font:600 12px/1.2 var(--font-ui);cursor:pointer;overflow-wrap:anywhere}
.steps .bar{height:5px;border-radius:3px;background:var(--line)}
.steps .done .bar{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.steps .cur{color:var(--ink)}
.steps .cur .bar{background:var(--accent)}
.ed-step{display:grid;gap:12px}
.ed-n{font:400 56px/1 var(--font-truth);color:var(--accent)}
.ed-step h2{margin:0;font:700 26px/1.15 var(--font-ui);letter-spacing:-.01em;text-wrap:balance}
.ed-step h2:focus{outline:none}
.help{color:var(--muted);font-size:16px;max-width:60ch}
.help-sm{color:var(--muted);font-size:15px}
textarea{min-height:150px;resize:vertical;line-height:1.45}
textarea.truth-in{font-family:var(--font-truth);font-size:20px}
.err{color:var(--danger);font-weight:600;font-size:15px}
.err:empty{display:none}
.ed-nav{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.note{background:var(--accent-soft);padding:10px 14px;border-radius:12px;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.read-links{display:grid;gap:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.read-h{display:flex;align-items:center;gap:6px;font:600 14px/1.3 var(--font-ui);color:var(--muted)}
.read-h svg{width:18px;height:18px}
.read-links{gap:10px}
.read-links .refs{gap:8px}
.ref-item{display:inline-flex;align-items:stretch;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.ref-item .ref{font-size:15px;padding:10px 4px 10px 14px;background:none;border-radius:0}
.ref-x{border:0;background:none;color:var(--accent);font:400 22px/1 var(--font-ui);padding:0 12px 0 8px;min-width:40px;cursor:pointer;opacity:.75}
.ref-add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ref-add input[type=text]{min-height:44px;padding:10px 12px}
.themes-all{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.themes-all > summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:600;font-size:16px;color:var(--accent);display:flex;justify-content:space-between;gap:12px}
.themes-all > summary::-webkit-details-marker{display:none}
.themes-all > summary::after{content:"+";font-size:20px;line-height:1}
.themes-all[open] > summary::after{content:"–"}
.themes{border-top:1px solid var(--line)}
.themes .chips{display:grid;gap:8px}
.chip.pick{display:grid;gap:2px;text-align:left;border-radius:12px;padding:10px 14px;width:100%}
.pick-ref{font-weight:700;font-size:15px}
.pick-txt{font-size:14px;color:var(--muted);line-height:1.3}
.chip.pick.on .pick-txt{color:var(--accent)}
.chip.pick.on .pick-ref::after{content:"  ✓"}
.themes details{border-bottom:1px solid var(--line)}
.themes summary{list-style:none;cursor:pointer;padding:13px 2px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:12px}
.themes summary::-webkit-details-marker{display:none}
.themes summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
.themes details[open] summary::after{content:"–"}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px}
.chip{font:500 15px/1.2 var(--font-ui);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.recap{display:grid;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.recap .ex-l{margin-bottom:2px}
.recap .old{color:var(--old);padding-left:10px;border-left:2px dotted var(--old)}

/* modal y aviso breve */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(8,14,12,.45);display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:520px;display:grid;gap:14px;max-height:85vh;overflow:auto}
.modal h2{margin:0;font:700 20px/1.25 var(--font-ui)}
.modal textarea{min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:70;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font:500 15px/1.35 var(--font-ui);width:max-content;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.editing #toast{bottom:calc(24px + env(safe-area-inset-bottom))}
/* aviso para instalar, fijo sobre la barra inferior */
.install{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:30;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.install[hidden],body.editing .install{display:none}
.install-card{max-width:576px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(10,30,22,.18);padding:14px 14px 16px;display:grid;grid-template-columns:48px 1fr 36px;gap:10px 12px;align-items:center}
.install-ic{width:48px;height:48px;border-radius:11px}
.install-t{font:700 16px/1.25 var(--font-ui)}
.install-s{font-size:14px;color:var(--muted);line-height:1.35}
.install-x{width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);font:500 22px/1 var(--font-ui);cursor:pointer;align-self:start}
.install-steps{grid-column:1/-1;margin:0;padding:0 0 0 22px;display:grid;gap:6px;font-size:15px;line-height:1.4}
.install-steps svg{width:18px;height:18px;vertical-align:-3px;color:var(--accent)}
.install-go{grid-column:1/-1}
.app{padding-bottom:calc(104px + var(--install-h,0px) + env(safe-area-inset-bottom))}
body.install-on #toast{bottom:calc(88px + var(--install-h,0px) + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion: reduce){
  .flash{animation:none}
  #toast{transition:none}
}

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
const unquote = s => String(s || '').trim().replace(/^[«"“'‘]+/, '').replace(/[»"”'’]+$/, '').trim();
const quote = s => '«' + unquote(s) + '»';
const byId = id => entries.find(e => e.id === id);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

const fDay = new Intl.DateTimeFormat('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
const fTime = new Intl.DateTimeFormat('es-CL', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fShort = new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short' });
const fNarrow = new Intl.DateTimeFormat('es-CL', { weekday: 'narrow' });
function dayKey(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayLabel(d) {
  const k = dayKey(d), t = new Date();
  if (k === dayKey(t)) return 'Hoy';
  const y = new Date(t); y.setDate(t.getDate() - 1);
  if (k === dayKey(y)) return 'Ayer';
  return cap(fDay.format(new Date(d)));
}
const timeLabel = d => fTime.format(new Date(d));
function whenLabel(d) {
  const l = dayLabel(d);
  return (l === 'Hoy' || l === 'Ayer' ? l.toLowerCase() : 'el ' + fDay.format(new Date(d))) + ' a las ' + timeLabel(d);
}
function toLocalInput(iso) { const d = iso ? new Date(iso) : new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
function fromLocalInput(v) { const d = new Date(v); return isNaN(d) ? new Date().toISOString() : d.toISOString(); }

function splitRefs(s) { return String(s || '').split(';').map(x => x.trim()).filter(Boolean); }
// Convierte «Romanos 8:28-29, 31» en { libro: 'ROM', cap: 8, v1: 28, v2: 29 }. Devuelve null si no lo reconoce.
function parseRef(ref) {
  const r = norm(ref).replace(/([a-z])\./g, '$1').replace(/[–—]/g, '-').replace(/\s+/g, ' ').trim();
  const m = r.match(/^((?:[123]\s?)?[a-z]+(?: de los [a-z]+)?)\s*(\d+)(?:\s*[:.]\s*(\d+)(?:\s*-\s*(\d+))?)?/);
  if (!m) return null;
  const nombre = m[1].replace(/^([123])\s?/, '$1 ');
  const libro = LIBROS[nombre] || LIBROS[nombre.replace(' ', '')];
  if (!libro) return null;
  const cap = +m[2], v1 = m[3] ? +m[3] : null, v2 = m[4] && m[3] ? +m[4] : null;
  return { libro: libro, cap: cap, v1: v1, v2: v2 && v2 > v1 ? v2 : null };
}
function versionActual() { return VERSIONES.find(v => v[0] === settings.version) || VERSIONES[0]; }
// Enlace a bible.com en español, en la versión elegida.
function webUrl(ref) {
  const p = parseRef(ref), ver = versionActual();
  if (!p) return 'https://www.bible.com/es/search/bible?q=' + encodeURIComponent(ref) + '&version_id=' + ver[2];
  const pasaje = p.libro + '.' + p.cap + (p.v1 ? '.' + p.v1 + (p.v2 ? '-' + p.v2 : '') : '');
  return 'https://www.bible.com/es/bible/' + ver[2] + '/' + pasaje + '.' + ver[0];
}
// Enlace que abre la app Biblia (YouVersion) en el pasaje.
function appUrl(ref) {
  const p = parseRef(ref); if (!p) return null;
  let refs = p.libro + '.' + p.cap;
  if (p.v1) { const vs = []; for (let v = p.v1; v <= (p.v2 || p.v1) && vs.length < 60; v++) vs.push(p.libro + '.' + p.cap + '.' + v); refs = vs.join('+'); }
  // La versión va con su abreviatura y con su número: la app Biblia usa la que reconozca e ignora la otra.
  const ver = versionActual();
  return 'youversion://bible?reference=' + refs + '&version=' + ver[0] + '&version_id=' + ver[2];
}
// Enlace a la app: en Android con «intent», que abre bible.com solo si la app no está instalada.
function appHref(ref) {
  const app = appUrl(ref); if (!app) return null;
  if (/Android/i.test(navigator.userAgent)) return 'intent://' + app.replace('youversion://', '') + '#Intent;scheme=youversion;package=com.sirma.mobile.bible.android;S.browser_fallback_url=' + encodeURIComponent(webUrl(ref)) + ';end';
  return app;
}
function usarApp(ref) { return settings.biblia === 'app' && !inFrame && (isIOS || /Android/i.test(navigator.userAgent)) && !!appUrl(ref); }
// Si la persona eligió la app, el enlace va directo a la app y sin target: así el iPhone no abre una ventana en blanco.
function bibleAttrs(ref) {
  if (usarApp(ref)) return 'href="' + esc(appHref(ref)) + '" data-bible="' + esc(ref) + '"';
  return 'href="' + esc(webUrl(ref)) + '" data-bible="' + esc(ref) + '" target="_blank" rel="noopener"';
}
function refLinks(s) { return splitRefs(s).map(r => '<a class="ref" ' + bibleAttrs(r) + '>' + esc(r) + '</a>').join(''); }

/* ---------- vistas ---------- */
function banners() {
  let h = '';
  if (!storageOK) {
    h += '<div class="banner warn" role="alert"><p><strong>Este navegador no permite guardar.</strong>Lo que escribas se perderá al cerrar. Abre Metanoia desde su enlace e instálala en tu pantalla de inicio.</p></div>';
  } else if (inFrame) {
    h += '<div class="banner"><p><strong>Vista previa</strong>Aquí puedes probar la app, pero lo que escribas puede borrarse. Para usarla de verdad, ábrela desde su enlace e instálala.</p></div>';
  }
  if (cloudDisponible() && cloud.ready && !cloud.user && !inFrame && !settings.cuentaAvisoCerrado) {
    h += '<div class="banner"><p><strong>Guarda tus registros en internet</strong>Crea tu cuenta con tu correo. Así, si cambias de teléfono o borras la app, recuperas todo.</p><div class="banner-actions"><button class="link" data-action="go-cuenta">Crear mi cuenta</button><button class="link" data-action="hide-cuenta">Ahora no</button></div></div>';
  }
  if (storageOK && !inFrame && !cloud.user && entries.length >= 5) {
    const last = settings.lastBackup ? new Date(settings.lastBackup) : null;
    if (!last || (Date.now() - last.getTime()) > 30 * 864e5) {
      h += '<div class="banner"><p><strong>Guarda una copia de seguridad</strong>Tus registros viven solo en este teléfono. Si borras la app, se pierden.</p><div class="banner-actions"><button class="link" data-action="backup">Guardar copia ahora</button></div></div>';
    }
  }
  return h;
}

function weekStrip() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(t); d.setDate(t.getDate() - i); days.push(d); }
  const today = dayKey(new Date());
  let total = 0, reps = 0;
  const cells = days.map(d => {
    const k = dayKey(d); let n = 0, r = 0;
    entries.forEach(e => { if (dayKey(e.fecha) === k) n++; (e.reps || []).forEach(x => { if (dayKey(x) === k) r++; }); });
    total += n; reps += r;
    const label = cap(fDay.format(d)) + ': ' + plural(n, 'registro', 'registros') + ', ' + plural(r, 'vez', 'veces') + ' volviste a la verdad';
    return '<li class="' + (n + r ? 'on ' : '') + (k === today ? 'today' : '') + '" aria-label="' + esc(label) + '"><span class="wd" aria-hidden="true">' + esc(fNarrow.format(d)) + '</span><span class="wn" aria-hidden="true">' + (n + r || '') + '</span></li>';
  }).join('');
  return '<section class="week" aria-label="Últimos 7 días"><p class="week-sum">Últimos 7 días: <strong>' + plural(total, 'registro', 'registros') + '</strong> y <strong>' + plural(reps, 'vez', 'veces') + '</strong> que volviste a la verdad</p><ol class="week-days">' + cells + '</ol></section>';
}

function exampleCard() {
  const e = EJEMPLO;
  return '<section class="example" aria-label="Ejemplo de registro"><p class="tag">Ejemplo</p>' +
    '<p class="muted">Así se ve un registro completo. Cuando aparezca un pensamiento que te inquieta, anótalo en estos cuatro pasos.</p>' +
    '<ol class="ex-cols">' +
    '<li><span class="ex-n">1</span><p><span class="ex-l">Desencadenante</span>' + esc(e.situacion) + '</p></li>' +
    '<li><span class="ex-n">2</span><p><span class="ex-l">¿Qué me dije?</span><span class="old">' + esc(quote(e.pensamiento)) + '</span></p></li>' +
    '<li><span class="ex-n">3</span><p><span class="ex-l">¿Qué dice Dios? · ' + esc(e.citas) + '</span>' + esc(e.palabra) + '</p></li>' +
    '<li><span class="ex-n">4</span><p><span class="ex-l">Mi nueva respuesta en fe</span><span class="truth">' + esc(e.verdad) + '</span></p></li>' +
    '</ol></section>';
}

function rowHTML(e) {
  const n = (e.reps || []).length;
  return '<li><button class="row" data-action="open" data-id="' + esc(e.id) + '">' +
    '<span class="row-time">' + timeLabel(e.fecha) + '</span>' +
    '<span class="row-body"><span class="row-old">' + esc(quote(clip(e.pensamiento, 120))) + '</span>' +
    (e.verdad && e.verdad.trim() ? '<span class="row-new">' + esc(clip(e.verdad, 170)) + '</span>' : '<span class="row-new pending">Falta escribir la verdad</span>') +
    '</span>' +
    (n ? '<span class="row-rep" aria-label="Volvió ' + plural(n, 'vez', 'veces') + '">×' + n + '</span>' : '<span></span>') +
    ICON.chev + '</button></li>';
}

function groupsHTML() {
  const q = norm(state.q);
  const list = entries.filter(e => !q || norm([e.situacion, e.pensamiento, e.citas, e.palabra, e.verdad].join(' ')).includes(q))
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!list.length) return '<p class="empty">No hay registros que coincidan con «' + esc(state.q) + '».</p>';
  const groups = []; let cur = null;
  list.forEach(e => { const k = dayKey(e.fecha); if (!cur || cur.k !== k) { cur = { k: k, label: dayLabel(e.fecha), items: [] }; groups.push(cur); } cur.items.push(e); });
  return groups.map(g => '<section class="group"><h2 class="group-h">' + esc(g.label) + '</h2><ul class="rows">' + g.items.map(rowHTML).join('') + '</ul></section>').join('');
}

function viewRegistros() {
  let h = '<header class="top"><p class="eyebrow">Metanoia · Romanos 12:2</p><h1 class="h1-app">Registro de Dialogo Interno</h1></header>';
  h += banners();
  h += '<button class="btn btn-primary btn-block" data-action="new">' + ICON.plus + '<span>Nuevo registro</span></button>';
  h += weekStrip();
  if (!entries.length) return h + exampleCard();
  h += '<label class="search" for="q">' + ICON.search + '<span class="sr-only">Buscar en mis registros</span><input id="q" type="search" placeholder="Buscar en mis registros" value="' + esc(state.q) + '" autocomplete="off" enterkeyhint="search"></label>';
  h += '<div id="groups" style="display:grid;gap:20px">' + groupsHTML() + '</div>';
  return h;
}

function col(n, title, body, extra) {
  return '<section class="col ' + (extra || '') + '"><span class="col-n" aria-hidden="true">' + n + '</span><div class="col-b"><h3>' + title + '</h3>' + body + '</div></section>';
}

function viewDetalle() {
  const e = byId(state.id);
  if (!e) { state.view = 'tab'; return viewTab(); }
  const n = (e.reps || []).length;
  const last = n ? e.reps[n - 1] : null;
  const none = t => '<p class="none">' + (t || 'Sin anotar.') + '</p>';
  const palabra = (e.citas ? '<div class="refs">' + refLinks(e.citas) + '</div>' : '') + (e.palabra ? '<p>' + nl(e.palabra) + '</p>' : '');
  return '<header class="top"><button class="back" data-action="back">' + ICON.back + '<span>' + (state.tab === 'verdades' ? 'Verdades' : 'Registros') + '</span></button>' +
    '<p class="eyebrow">' + esc(dayLabel(e.fecha)) + ' · ' + timeLabel(e.fecha) + '</p></header>' +
    '<article class="cols" aria-label="Registro">' +
    col(1, 'Desencadenante', e.situacion ? '<p>' + nl(e.situacion) + '</p>' : none()) +
    col(2, '¿Qué me dije?', '<p class="old">' + nl(quote(e.pensamiento)) + '</p>') +
    col(3, '¿Qué dice Dios?', palabra || none()) +
    col(4, 'Mi nueva respuesta en fe', e.verdad ? '<p class="truth" id="truth-text">' + nl(e.verdad) + '</p>' : none('Todavía no escribes tu nueva respuesta en fe.'), 'col-truth') +
    '</article>' +
    '<section class="again"><button class="btn btn-primary" data-action="again" data-id="' + esc(e.id) + '">' + ICON.repeat + '<span>Volvió este pensamiento</span></button>' +
    '<p class="again-note">' + (n ? 'Volvió ' + plural(n, 'vez', 'veces') + '. La última, ' + whenLabel(last) + '.' : 'Cuando vuelva, toca el botón y repite la verdad. Los caminos nuevos se fortalecen con la repetición.') + '</p></section>' +
    '<div class="detail-actions"><button class="btn btn-ghost" data-action="edit" data-id="' + esc(e.id) + '">Editar</button><button class="btn btn-ghost danger" data-action="delete" data-id="' + esc(e.id) + '">Eliminar</button></div>';
}

function truthList(items, cls) {
  return '<ul class="truths ' + (cls || '') + '">' + items.map(([t, r]) => '<li><p class="truth">' + esc(t) + '</p><div class="truth-meta"><div class="refs">' + refLinks(r) + '</div></div></li>').join('') + '</ul>';
}

// Recuerda qué grupos de verdades dejó abiertos la persona, para que no se cierren al volver a dibujar.
const truthOpen = new Set(); truthOpen.touched = false;
document.addEventListener('toggle', ev => {
  const d = ev.target; if (!d.classList || !d.classList.contains('truth-group')) return;
  if (!truthOpen.touched) VERDADES_GRUPOS.forEach((g, j) => { if (g[1]) truthOpen.add(j); });
  truthOpen.touched = true; const i = +d.dataset.grupo;
  if (d.open) truthOpen.add(i); else truthOpen.delete(i);
}, true);
function viewVerdades() {
  const seen = new Set();
  const mine = entries.filter(e => e.verdad && e.verdad.trim())
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))
    .filter(e => { const k = norm(e.verdad).replace(/\W+/g, ' ').trim(); if (seen.has(k)) return false; seen.add(k); return true; });
  let h = '<header class="top"><p class="eyebrow">Metanoia · tarjeta de verdades</p><h1>Verdades para repetir</h1><p class="lead">Léelas apenas vuelva el pensamiento. Las primeras son las que tú escribiste; abajo hay más, ordenadas por situación.</p></header>';
  h += '<section><h2 class="sec-h">De mis registros</h2>';
  if (mine.length) {
    h += '<ul class="truths">' + mine.map(e => '<li><p class="truth">' + nl(e.verdad) + '</p><div class="truth-meta">' + (e.citas ? '<div class="refs">' + refLinks(e.citas) + '</div>' : '') + '<button class="link" data-action="open" data-id="' + esc(e.id) + '">Ver registro</button></div></li>').join('') + '</ul>';
  } else {
    h += '<p class="panel muted">Aquí aparecerán las verdades que escribas en el paso 4 de cada registro.</p>';
  }
  h += '</section>';
  h += '<section><h2 class="sec-h">Verdades por situación</h2><div class="truth-groups">' + VERDADES_GRUPOS.map(([t, abierto, items], i) =>
    '<details class="truth-group" data-grupo="' + i + '"' + ((truthOpen.has(i) || (abierto && !truthOpen.touched)) ? ' open' : '') + '><summary><span>' + esc(t) + '</span><span class="count">' + items.length + '</span></summary>' + truthList(items, 'guide') + '</details>').join('') + '</div></section>';
  return h;
}

function rangeInfo(range) {
  const now = new Date();
  if (range === 'todo') return { from: null, label: 'Todos los registros' };
  if (range === 'ultimo' && settings.lastSent) return { from: new Date(settings.lastSent), byUpdate: true, label: 'Desde el último envío (' + fShort.format(new Date(settings.lastSent)) + ')' };
  const days = range === '30' ? 30 : 7;
  const from = new Date(now); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - (days - 1));
  return { from: from, label: 'Últimos ' + days + ' días (' + fShort.format(from) + ' – ' + fShort.format(now) + ')' };
}
function entriesInRange(range) {
  const r = rangeInfo(range);
  return entries.filter(e => {
    if (!r.from) return true;
    if (r.byUpdate) return new Date(e.actualizado || e.fecha) > r.from;
    return new Date(e.fecha) >= r.from || (e.reps || []).some(x => new Date(x) >= r.from);
  });
}
function buildReport(range) {
  const list = entriesInRange(range).slice().sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
  const L = ['SELF-TALK LOG'];
  const who = [settings.nombre ? 'De: ' + settings.nombre : '', settings.consejeroNombre ? 'Para: ' + settings.consejeroNombre : ''].filter(Boolean).join(' · ');
  if (who) L.push(who);
  L.push(rangeInfo(range).label + ' · ' + plural(list.length, 'registro', 'registros'));
  if (!list.length) { L.push('', '(No hay registros en este período.)'); return L.join('\n'); }
  list.forEach((e, i) => {
    L.push('', '— ' + (i + 1) + '. ' + cap(fDay.format(new Date(e.fecha))) + ', ' + timeLabel(e.fecha) + ' —');
    L.push('1. Desencadenante: ' + (e.situacion ? e.situacion.trim() : '—'));
    L.push('2. ¿Qué me dije?: ' + quote(e.pensamiento));
    const w = [e.citas ? '(' + e.citas.trim() + ')' : '', e.palabra ? e.palabra.trim() : ''].filter(Boolean).join(' ');
    L.push('3. ¿Qué dice Dios?: ' + (w || '—'));
    L.push('4. Mi nueva respuesta en fe: ' + (e.verdad ? e.verdad.trim() : '—'));
    const n = (e.reps || []).length;
    if (n) L.push('Volvió ' + plural(n, 'vez', 'veces') + '.');
  });
  return L.join('\n');
}

function viewEnviar() {
  if (state.range === 'ultimo' && !settings.lastSent) state.range = '7';
  const opts = [['ultimo', 'Desde el último envío'], ['7', 'Últimos 7 días'], ['30', 'Últimos 30 días'], ['todo', 'Todos']];
  const n = entriesInRange(state.range).length;
  let h = '<header class="top"><p class="eyebrow">Metanoia · para la próxima sesión</p><h1>Enviar a mi consejero</h1><p class="lead">Elige qué registros enviar. Se abrirá el menú Compartir para mandarlos por WhatsApp, correo o Mensajes.</p></header>';
  h += '<fieldset class="seg"><legend class="sr-only">Qué registros enviar</legend>' + opts.map(([v, l]) => {
    const dis = v === 'ultimo' && !settings.lastSent;
    return '<label class="opt"><input type="radio" name="range" value="' + v + '"' + (state.range === v ? ' checked' : '') + (dis ? ' disabled' : '') + '><span>' + l + '</span></label>';
  }).join('') + '</fieldset>';
  h += '<p class="send-sum"><strong>' + plural(n, 'registro', 'registros') + '</strong> · ' + esc(rangeInfo(state.range).label) + '</p>';
  if (!settings.nombre) h += '<label class="fld" for="s-nombre-env"><span>Tu nombre (aparece en el envío)</span><input id="s-nombre-env" type="text" data-setting="nombre" autocomplete="name" value="' + esc(settings.nombre) + '"></label>';
  h += '<pre class="preview" id="report" aria-label="Texto que se enviará">' + esc(buildReport(state.range)) + '</pre>';
  h += '<div class="stack">';
  if (navigator.share && !inFrame) h += '<button class="btn btn-primary" data-action="share"' + (n ? '' : ' disabled') + '>' + ICON.share + '<span>Compartir con mi consejero</span></button><button class="btn btn-ghost" data-action="copy"' + (n ? '' : ' disabled') + '>' + ICON.copy + '<span>Copiar texto</span></button>';
  else h += '<button class="btn btn-primary" data-action="copy"' + (n ? '' : ' disabled') + '>' + ICON.copy + '<span>Copiar texto</span></button>';
  h += '<p class="muted">' + (settings.lastSent ? 'Último envío: ' + whenLabel(settings.lastSent) + '.' : 'Todavía no has enviado registros.') + '</p></div>';
  return h;
}

function viewAjustes() {
  let h = '<header class="top"><p class="eyebrow">Metanoia</p><h1>Ajustes y ayuda</h1></header>';
  h += '<section class="panel urgent" id="ayuda"><h2>Ayuda urgente</h2>' + helpHTML() + '</section>';

/* ---------- editor de 4 pasos ---------- */
function blankDraft() { return { fecha: new Date().toISOString(), situacion: '', pensamiento: '', citas: '', palabra: '', verdad: '' }; }
function hasContent(d) { return d && ['situacion', 'pensamiento', 'citas', 'palabra', 'verdad'].some(k => (d[k] || '').trim()); }
function stepFilled(d, s) { return s.n === 3 ? !!((d.citas || '').trim() || (d.palabra || '').trim()) : !!(d[s.key] || '').trim(); }

function openNew() {
  const dr = load(K_DRAFT, null);

}
function openEdit(id, step) {

  state.editor = { step: step || 1, id: id, data: { fecha: e.fecha, situacion: e.situacion || '', pensamiento: e.pensamiento || '', citas: e.citas || '', palabra: e.palabra || '', verdad: e.verdad || '' }, restored: false, dirty: false };

function showEditor() {

}
function themesHTML(d) {

    refs.map(r => '<button type="button" class="chip pick' + (have.has(norm(r)) ? ' on' : '') + '" data-action="add-ref" data-ref="' + esc(r) + '" aria-pressed="' + (have.has(norm(r)) ? 'true' : 'false') + '"><span class="pick-ref">' + esc(r) + '</span>' + (RESUMEN[r] ? '<span class="pick-txt">' + esc(RESUMEN[r]) + '</span>' : '') + '</button>').join('') +

function stepFields(s, d) {

  }
  if (s.n === 2) {

  }

    (((d.citas || '').trim() || (d.palabra || '').trim()) ? '<p><span class="ex-l">¿Qué dice Dios?' + (d.citas ? ' · ' + esc(d.citas) : '') + '</span>' + nl(d.palabra || '') + '</p>' : '') + '</div>' : '';
  return recap + fieldTA(s, d, 'truth-in');
}

function renderEditor() {
  const ed = state.editor, s = STEPS[ed.step - 1], d = ed.data;
  $('#editor').innerHTML = '<div class="ed-bar"><header class="ed-top"><button type="button" class="ed-cancel" data-action="ed-cancel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Cancelar</button><p class="ed-title">' + (ed.id ? 'Editando' : 'Registrando') + '</p><p class="ed-count" aria-label="Paso ' + ed.step + ' de 4">Paso ' + ed.step + '/4</p></header></div>' +

    (ed.restored && ed.step === 1 ? '<p class="note">Recuperamos el borrador que dejaste a medias. <button class="link" data-action="ed-reset">Empezar de cero</button></p>' : '') +

}
function grow(t) { t.style.height = 'auto'; t.style.height = Math.max(150, t.scrollHeight + 2) + 'px'; }
function setErr(m) { const el = $('#ed-err'); if (el) el.textContent = m; }

function goStep(n) {
  state.editor.step = Math.min(4, Math.max(1, n));
  renderEditor();
  const h = $('#ed-h'); if (h) h.focus({ preventScroll: true });
}

function saveEntry() {
  const ed = state.editor, d = ed.data;
  if (!(d.pensamiento || '').trim()) { goStep(2); setErr('Escribe lo que te dijiste (paso 2) para poder guardar el registro.'); return; }
  const now = new Date().toISOString();
  const clean = { fecha: d.fecha || now, situacion: (d.situacion || '').trim(), pensamiento: (d.pensamiento || '').trim(), citas: (d.citas || '').trim().replace(/;\s*$/, ''), palabra: (d.palabra || '').trim(), verdad: (d.verdad || '').trim() };
  let id = ed.id;
  if (id) { Object.assign(byId(id), clean, { actualizado: now }); }
  else { id = uid(); entries.push(Object.assign({ id: id, creado: now, actualizado: now, reps: [] }, clean)); save(K_DRAFT, null); }
  persist(); markDirty(id);
  const wasNew = !ed.id;
  state.tab = state.tab === 'verdades' ? 'verdades' : 'registros';
  state.view = 'detalle'; state.id = id;
  closeEditor();
  window.scrollTo(0, 0);
  toast(wasNew ? (clean.verdad ? 'Guardado. Repite la verdad cada vez que el pensamiento vuelva.' : 'Guardado. Completa el paso 4 cuando puedas.') : 'Cambios guardados.');
}

function addRef(ref) {
  const d = state.editor.data;
  const refs = splitRefs(d.citas);
  const i = refs.map(norm).indexOf(norm(ref));
  if (i >= 0) refs.splice(i, 1); else refs.push(ref);
  setCitas(refs);
}
// Un solo recuadro de pasajes: cada pasaje se toca para leerlo en la Biblia, con × para quitarlo, y abajo se puede escribir uno a mano.
function citasHeadHTML(refs) {
  return refs.length ? ICON.book + '<span>Toca un pasaje para leerlo en la Biblia</span>' : '<span>Elige pasajes en «Buscar pasajes por tema» o escríbelos aquí abajo.</span>';
}
function citasItemsHTML(refs) {
  return refs.map(r => '<span class="ref-item"><a class="ref" ' + bibleAttrs(r) + '>' + esc(r) + '</a><button type="button" class="ref-x" data-action="remove-ref" data-ref="' + esc(r) + '" aria-label="Quitar ' + esc(r) + '">×</button></span>').join('');
}
function citasBoxHTML(d) {
  const refs = splitRefs(d.citas);
  return '<div id="read-links" class="read-links"><p class="read-h">' + citasHeadHTML(refs) + '</p><div class="refs' + (refs.length ? '' : ' hidden') + '">' + citasItemsHTML(refs) + '</div>' +
    '<div class="ref-add"><input id="f-ref-nuevo" type="text" placeholder="Ej.: Romanos 8:1" autocomplete="off" enterkeyhint="done" aria-label="Escribir un pasaje"><button type="button" class="btn btn-ghost btn-sm" data-action="add-typed-ref">Agregar</button></div></div>';
}
function updateReadLink() {
  const box = $('#read-links'); if (!box) return;
  const refs = splitRefs(state.editor.data.citas);
  box.querySelector('.read-h').innerHTML = citasHeadHTML(refs);

function setCitas(refs) {
  const d = state.editor.data;
  d.citas = refs.join('; ');
  state.editor.dirty = true;
  if (!state.editor.id) save(K_DRAFT, d);
  document.querySelectorAll('#editor .chip[data-ref]').forEach(c => { const on = refs.map(norm).includes(norm(c.dataset.ref)); c.classList.toggle('on', on); c.setAttribute('aria-pressed', on ? 'true' : 'false'); });
  updateReadLink();

// Agrega lo escrito a mano (puede ser más de uno, separados por punto y coma). Devuelve true si agregó algo.
function addTypedRefs() {
  const inp = $('#f-ref-nuevo'); if (!inp || !state.editor) return false;
  const nuevos = splitRefs(inp.value.replace(/\n/g, ';'));
  if (!nuevos.length) return false;
  const refs = splitRefs(state.editor.data.citas);
  nuevos.forEach(r => { if (!refs.map(norm).includes(norm(r))) refs.push(r); });
  inp.value = '';
  setCitas(refs);
  return true;
}
function removeRef(ref) {
  setCitas(splitRefs(state.editor.data.citas).filter(r => norm(r) !== norm(ref)));
}

/* ---------- modal y aviso breve ---------- */

function toast(msg) {

/* ---------- enviar, copiar, respaldo ---------- */
function legacyCopy(text) {
  try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { return legacyCopy(text); }
}
function markSent() { settings.lastSent = new Date().toISOString(); saveSettings(); state.range = 'ultimo'; }
async function doShare() {
  const text = buildReport(state.range);
  try { await navigator.share({ title: 'Self-Talk Log', text: text }); markSent(); render(); toast('Listo. La próxima vez, «Desde el último envío» empezará aquí.'); }
  catch (err) { if (err && err.name === 'AbortError') return; doCopy(); }
}
async function doCopy() {
  const text = buildReport(state.range);
  if (await copyText(text)) { markSent(); render(); toast('Texto copiado. Pégalo en WhatsApp o en un correo para tu consejero.'); }
  else toast('No se pudo copiar. Mantén presionado el texto para seleccionarlo.');
}

function backupJSON() { return JSON.stringify({ app: 'renovar', formato: 1, exportado: new Date().toISOString(), registros: entries, ajustes: { nombre: settings.nombre, consejeroNombre: settings.consejeroNombre, consejeroTel: settings.consejeroTel, version: settings.version } }, null, 2); }
function markBackup() { settings.lastBackup = new Date().toISOString(); saveSettings(); }
async function doBackup() {
  const json = backupJSON();
  const name = 'renovar-copia-' + dayKey(new Date()) + '.json';
  if (!inFrame) {
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Copia de seguridad de Metanoia' });
        markBackup(); render(); toast('Copia guardada.'); return;
      }
      const url = URL.createObjectURL(file);
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      markBackup(); render(); toast('Copia descargada en Archivos.'); return;
    } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  const k = await modal('Copia de seguridad', '<p class="muted">Copia este texto y guárdalo en una nota o envíatelo por correo. Para restaurar, guárdalo como archivo .json.</p><textarea id="m-json" readonly>' + esc(json) + '</textarea>', [{ key: 'copy', label: 'Copiar', cls: 'btn-primary' }, { key: 'close', label: 'Cerrar' }]);
  if (k === 'copy') { if (await copyText(json)) { markBackup(); render(); toast('Copia copiada.'); } else toast('No se pudo copiar.'); }
}
function sanitize(x) {
  const s = v => typeof v === 'string' ? v : '';
  const okDate = v => { const d = new Date(v); return isNaN(d) ? null : d.toISOString(); };
  return { id: s(x.id) || uid(), fecha: okDate(x.fecha) || new Date().toISOString(), creado: okDate(x.creado) || new Date().toISOString(), actualizado: okDate(x.actualizado) || new Date().toISOString(),
    situacion: s(x.situacion), pensamiento: s(x.pensamiento), citas: s(x.citas), palabra: s(x.palabra), verdad: s(x.verdad), reps: Array.isArray(x.reps) ? x.reps.map(okDate).filter(Boolean) : [] };
}
function restoreFrom(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('Ese archivo no es una copia de Metanoia.'); return; }
  const list = data && (data.registros || data.entries);
  if (!Array.isArray(list)) { toast('Ese archivo no es una copia de Metanoia.'); return; }
  let added = 0, updated = 0;
  list.forEach(x => {
    if (!x || (!x.pensamiento && !x.situacion)) return;
    const y = sanitize(x); const cur = byId(y.id);
    if (!cur) { entries.push(y); added++; markDirty(y.id); }
    else if (y.actualizado > (cur.actualizado || '')) { Object.assign(cur, y); updated++; markDirty(y.id); }
  });
  const a = data.ajustes || {};
  ['nombre', 'consejeroNombre', 'consejeroTel', 'version'].forEach(k => { if (!settings[k] && typeof a[k] === 'string') settings[k] = a[k]; });
  persist(); saveSettings(); render();
  toast('Restaurado: ' + plural(added, 'registro nuevo', 'registros nuevos') + (updated ? ' y ' + plural(updated, 'actualizado', 'actualizados') : '') + '.');
}

/* ---------- abrir pasajes: app Biblia (YouVersion) o bible.com ---------- */
const isAndroid = /Android/i.test(navigator.userAgent);
function refreshBibleLinks() { if (state.editor) updateReadLink(); else render(); }
// iPhone: si la app se abre, esta página pasa a segundo plano (o se congela y el reloj llega tarde).
// Si a los 2,5 s sigue a la vista, la app no respondió: se ofrece bible.com con un botón (sin abrir nada solo).
function vigilarApp(ref) {
  if (!isIOS) return;
  let salio = false; const t0 = Date.now();
  const marcar = () => { salio = true; };
  const vis = () => { if (document.hidden) salio = true; };
  document.addEventListener('visibilitychange', vis);
  window.addEventListener('pagehide', marcar);
  window.addEventListener('blur', marcar);
  setTimeout(async () => {
    document.removeEventListener('visibilitychange', vis);
    window.removeEventListener('pagehide', marcar);
    window.removeEventListener('blur', marcar);
    if (salio || document.hidden || Date.now() - t0 > 4000) return;
    const k = await modal('No se abrió la app Biblia', '<p class="muted">Puede que no esté instalada en este teléfono. Puedes leer el pasaje en bible.com.</p>',
      [{ key: 'web', label: 'Abrir en bible.com', cls: 'btn-primary', href: webUrl(ref), blank: true }, { key: 'no', label: 'Cerrar' }]);
    if (k === 'web') { settings.biblia = 'web'; saveSettings(); refreshBibleLinks(); toast('Desde ahora los pasajes se abren en bible.com. Puedes cambiarlo en Ajustes.'); }
  }, 2500);
}
async function openBible(ref, ev) {
  if (!ref) return;
  const movil = isIOS || isAndroid;
  if (!movil || inFrame || settings.biblia === 'web') return; // el enlace normal abre bible.com
  if (settings.biblia === 'app') { if (appUrl(ref)) vigilarApp(ref); return; } // el enlace ya va directo a la app
  // Primera vez: se pregunta. Cada respuesta es un enlace de verdad, para que el teléfono lo abra sin ventanas extra.
  ev.preventDefault();
  const app = appHref(ref);
  const k = await modal('¿Tienes la app Biblia?', '<p class="muted">Si tienes instalada la app Biblia (YouVersion), los pasajes se abren ahí. Si no, se abren en bible.com. Te lo preguntamos solo esta vez; puedes cambiarlo en Ajustes.</p>',
    [app ? { key: 'app', label: 'Sí, abrir en la app Biblia', cls: 'btn-primary', href: app } : { key: 'app', label: 'Sí, usar la app Biblia', cls: 'btn-primary' },

  render(); window.scrollTo(0, 0);
}

document.addEventListener('click', async ev => {

const FIREBASE_V = '10.14.1';
const K_PEND = 'renovar.pendientes.v1';   // registros con cambios por subir
const K_TOMBS = 'renovar.borrados.v1';    // registros borrados por avisar
const PRIVACIDAD_NUBE = 'Tus registros se guardan en este teléfono y en tu cuenta en Firebase (un servicio de Google), en el proyecto de tu consejero. La app solo te deja ver los tuyos, y nadie más puede verlos desde la app.';

function cloudDisponible() { return !!(FIREBASE_CONFIG || window.__metanoiaCloud) && storageOK; }
async function cloudApi() {
  if (cloud.api) return cloud.api;
  if (window.__metanoiaCloud) return (cloud.api = window.__metanoiaCloud); // solo para pruebas
  if (!FIREBASE_CONFIG) return null;
  const B = 'https://www.gstatic.com/firebasejs/' + FIREBASE_V + '/';
  const [fa, fau, ffs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore-lite.js')]);
  const app = fa.initializeApp(FIREBASE_CONFIG);
  const auth = fau.getAuth(app); auth.languageCode = 'es';
  const db = ffs.getFirestore(app);
  cloud.api = {
    onUser: cb => fau.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)),
    signIn: (e, p) => fau.signInWithEmailAndPassword(auth, e, p),
    signUp: (e, p) => fau.createUserWithEmailAndPassword(auth, e, p),
    reset: e => fau.sendPasswordResetEmail(auth, e),
    signOut: () => fau.signOut(auth),
    pull: async uid => {
      const snap = await ffs.getDocs(ffs.collection(db, 'usuarios', uid, 'registros'));
      const registros = []; snap.forEach(d => registros.push(d.data()));
      const u = await ffs.getDoc(ffs.doc(db, 'usuarios', uid));
      return { registros: registros, ajustes: u.exists() ? (u.data().ajustes || null) : null };
    },
    push: async (uid, items, ajustes) => {
      for (let i = 0; i < Math.max(items.length, 1); i += 400) {
        const b = ffs.writeBatch(db);
        items.slice(i, i + 400).forEach(x => b.set(ffs.doc(db, 'usuarios', uid, 'registros', x.id), x));
        if (i === 0 && ajustes) b.set(ffs.doc(db, 'usuarios', uid), { ajustes: ajustes }, { merge: true });
        await b.commit();
      }
    }
  };
  return cloud.api;
}

function markDirty(id) { const p = load(K_PEND, []); if (!p.includes(id)) { p.push(id); save(K_PEND, p); } scheduleSync(); }
function markDeleted(id) { const t = load(K_TOMBS, {}); t[id] = new Date().toISOString(); save(K_TOMBS, t); markDirty(id); }
function settingsChanged() { settings.ajustesActualizado = new Date().toISOString(); saveSettings(); scheduleSync(); }
let syncTimer = null;
function scheduleSync() { if (!cloud.user) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 1200); }

const AJUSTES_NUBE = ['nombre', 'consejeroNombre', 'consejeroTel', 'consejeroEditado', 'version', 'versionElegida', 'biblia'];
function ajustesParaNube() { const a = { actualizado: settings.ajustesActualizado || '' }; AJUSTES_NUBE.forEach(k => { if (settings[k] !== undefined) a[k] = settings[k]; }); return a; }
function errorTexto(e) {
  const c = (e && e.code) || '';
  if (/invalid-email/.test(c)) return 'Ese correo no es válido.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'El correo o la contraseña no coinciden.';
  if (/email-already-in-use/.test(c)) return 'Ya existe una cuenta con ese correo. Toca «Entrar».';
  if (/weak-password/.test(c)) return 'La contraseña debe tener al menos 6 caracteres.';
  if (/too-many-requests/.test(c)) return 'Demasiados intentos. Espera unos minutos y vuelve a intentarlo.';
  if (/network|unavailable|failed-precondition|offline/.test(c) || !navigator.onLine) return 'Sin conexión. Se guardará cuando vuelva internet.';
  if (/permission-denied/.test(c)) return 'El servicio rechazó el acceso. Avísale a tu consejero.';
  return 'No se pudo conectar. Inténtalo de nuevo en un momento.';
}

async function syncNow(full) {
  if (!cloud.user || cloud.syncing) return;
  const api = await cloudApi().catch(() => null); if (!api) return;
  cloud.syncing = true; cloud.error = ''; refreshCuenta();
  let cambiosLocales = false;
  try {
    const uid = cloud.user.uid;
    const tombs = load(K_TOMBS, {});
    const pend = new Set(load(K_PEND, []));
    if (full) {
      const r = await api.pull(uid);
      const remote = new Map(r.registros.map(x => [x.id, x]));
      remote.forEach((x, id) => {
        const cur = byId(id);
        if (x.borrado) {
          if (cur && (cur.actualizado || '') <= (x.actualizado || '')) { entries = entries.filter(e => e.id !== id); cambiosLocales = true; }
          return;
        }
        if (tombs[id] && tombs[id] >= (x.actualizado || '')) return; // se borró aquí después
        const y = sanitize(x);
        if (!cur) { entries.push(y); cambiosLocales = true; }
        else if ((y.actualizado || '') > (cur.actualizado || '')) { Object.assign(cur, y); cambiosLocales = true; }
      });
      entries.forEach(e => { const x = remote.get(e.id); if (!x || x.borrado || (e.actualizado || '') > (x.actualizado || '')) pend.add(e.id); });
      Object.keys(tombs).forEach(id => pend.add(id));
      const ra = r.ajustes;
      if (ra && (ra.actualizado || '') > (settings.ajustesActualizado || '')) {
        AJUSTES_NUBE.forEach(k => { if (ra[k] !== undefined) settings[k] = ra[k]; });
        settings.ajustesActualizado = ra.actualizado; cambiosLocales = true;
      }
      if (cambiosLocales) persist();
    }
    const ids = [...pend];
    const items = ids.map(id => { const e = byId(id); if (e) return Object.assign(sanitize(e), { borrado: false }); if (tombs[id]) return { id: id, borrado: true, actualizado: tombs[id] }; return null; }).filter(Boolean);
    await api.push(uid, items, ajustesParaNube());
    // quita de la lista solo lo que se subió (pudo haber cambios nuevos mientras tanto)
    save(K_PEND, load(K_PEND, []).filter(id => !ids.includes(id)));
    const t2 = load(K_TOMBS, {}); ids.forEach(id => { if (t2[id] === tombs[id]) delete t2[id]; }); save(K_TOMBS, t2);
    settings.lastSync = new Date().toISOString();
    if (full) cloud.lastFull = Date.now();
  } catch (e) {
    cloud.error = errorTexto(e);
  } finally {
    cloud.syncing = false; saveSettings();
    const a = document.activeElement;
    const escribiendo = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    if (cambiosLocales && !state.editor && !escribiendo) render(); else refreshCuenta();
  }
}

async function cuentaSalir() {
  const k = await modal('¿Cerrar sesión?', '<p class="muted">Tus registros siguen guardados en tu cuenta. Puedes dejarlos también en este teléfono o borrarlos de aquí (por ejemplo, si el teléfono no es tuyo).</p>',
    [{ key: 'salir', label: 'Cerrar sesión', cls: 'btn-primary' }, { key: 'borrar', label: 'Cerrar sesión y borrar de este teléfono' }, { key: 'no', label: 'Cancelar' }]);
  if (k !== 'salir' && k !== 'borrar') return;
  if (load(K_PEND, []).length) await syncNow(false);
  const api = await cloudApi().catch(() => null);
  try { if (api) await api.signOut(); } catch (e) {}
  cloud.user = null; settings.lastSync = null;
  if (k === 'borrar') { entries = []; persist(); save(K_DRAFT, null); }
  save(K_PEND, []); save(K_TOMBS, {}); saveSettings();
  render(); toast(k === 'borrar' ? 'Sesión cerrada y registros quitados de este teléfono.' : 'Sesión cerrada.');
}
async function initCloud() {
  if (!cloudDisponible() || inFrame) return;
  let api = null;
  try { api = await cloudApi(); } catch (e) { cloud.error = errorTexto(e); }
  if (!api) { if (state.tab === 'ajustes') render(); return; }
  cloud.ready = true;
  let primera = true;
  api.onUser(u => {
    const antes = cloud.user ? cloud.user.uid : null;
    cloud.user = u;
    if (u && u.uid !== antes) syncNow(true);
    if (primera || (u ? u.uid : null) !== antes) { primera = false; if (!state.editor) render(); }
  });
  // Al volver a la app, trae lo que se haya escrito en otro teléfono
  document.addEventListener('visibilitychange', () => { if (!document.hidden && cloud.user && Date.now() - cloud.lastFull > 60000) syncNow(true); });
  window.addEventListener('online', () => { if (cloud.user) syncNow(true); });
}

/* ---------- inicio ---------- */
const h0 = location.hash.slice(1);
state.tab = TABS.includes(h0) ? h0 : 'registros';
render();
renderInstall();
initCloud();

if (!inFrame) {
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
})();
