<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renovando Tu Mente</title>
<meta name="description" content="Self-Talk Log: renovar el entendimiento reemplazando los pensamientos falsos por la verdad (Romanos 12:2).">
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Renovando Tu Mente">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  /* Plan: una sola columna tranquila, como una libreta. Lo viejo va en tinta gris con borde punteado;
     lo verdadero, en el verde de un sendero nuevo y en letra serif. */
  --bg:#F1F4F2;
  --surface:#FFFFFF;
  --ink:#15231E;
  --muted:#5A6A64;
  --line:#D6DFDA;
  --accent:#2B6A4D;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0EDE6;
  --old:#73685F;
  --danger:#A3392A;
  --danger-soft:#F6E6E2;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-truth:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211C; --ink:#E4EDE8; --muted:#93A59D; --line:#273631;
    --accent:#7CC29E; --accent-ink:#0B1310; --accent-soft:#1A3026;
    --old:#B5A99F; --danger:#E8877A; --danger-soft:#3A1F1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211C; --ink:#E4EDE8; --muted:#93A59D; --line:#273631;
  --accent:#7CC29E; --accent-ink:#0B1310; --accent-soft:#1A3026;
  --old:#B5A99F; --danger:#E8877A; --danger-soft:#3A1F1A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--font-ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
p{margin:0}

.app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#main{display:flex;flex-direction:column;gap:20px}

/* encabezados */
.top{display:grid;gap:4px}
.eyebrow{font:600 13px/1.3 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
h1{font:700 30px/1.12 var(--font-ui);letter-spacing:-.015em;margin:0;text-wrap:balance}
.lead{color:var(--muted);font-size:16px;max-width:60ch}
.sec-h{font:600 13px/1.3 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;font:600 17px/1.1 var(--font-ui);border:1px solid transparent;cursor:pointer;text-decoration:none;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost.danger{color:var(--danger)}
.btn-sm{min-height:40px;font-size:15px;padding:0 14px}
.btn-block{width:100%}
.btn svg{width:20px;height:20px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hidden{display:none!important}

/* avisos */
.banner{display:grid;gap:10px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);font-size:16px}
.banner.warn{background:var(--danger-soft)}
.banner strong{display:block;margin-bottom:2px}
.banner-actions{display:flex;gap:18px;flex-wrap:wrap}

/* semana */
.week{display:grid;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.week-sum{font-size:15px;color:var(--muted)}
.week-sum strong{color:var(--ink);font-variant-numeric:tabular-nums}
.week-days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week-days li{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd{font:600 12px/1 var(--font-ui);color:var(--muted);text-transform:uppercase}
.wn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--line);font:600 14px/1 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--muted)}
.week-days li.on .wn{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink)}
.week-days li.today .wd{color:var(--ink)}

/* búsqueda */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px;color:var(--muted)}
.search:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.search svg{width:20px;height:20px}
.search input{border:0;background:transparent;flex:1;font:17px var(--font-ui);color:var(--ink);min-height:46px;outline:none;min-width:0}

/* lista de registros */
.group{display:grid;gap:8px}
.group-h{font:600 15px/1.3 var(--font-ui);margin:0}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rows > li + li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:46px 1fr auto 18px;gap:10px;align-items:start;width:100%;padding:14px 12px 14px 14px;background:none;border:0;text-align:left;cursor:pointer}
.row-time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.row-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.row-old{font-size:15px;line-height:1.4;color:var(--old);padding-left:10px;border-left:2px dotted var(--old);overflow-wrap:anywhere}
.row-new{font:400 18px/1.35 var(--font-truth);padding-left:10px;border-left:3px solid var(--accent);overflow-wrap:anywhere}
.row-new.pending{font:600 13px/1.2 var(--font-ui);color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:5px 10px;align-self:flex-start}
.row-rep{font:600 13px/1 var(--font-ui);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 8px;font-variant-numeric:tabular-nums}
.row > svg{width:18px;height:18px;color:var(--muted);align-self:center}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

/* ejemplo */
.example{display:grid;gap:14px;padding:16px;border:1px dashed var(--muted);border-radius:var(--r)}
.tag{justify-self:start;font:700 12px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--surface)}
.ex-cols{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ex-cols li{display:grid;grid-template-columns:26px 1fr;gap:8px}
.ex-n{font:400 20px/1.2 var(--font-truth);color:var(--muted)}
.ex-l{display:block;font:600 12px/1.3 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ex-cols .old{color:var(--old)}
.ex-cols .truth{font-family:var(--font-truth);font-size:19px;line-height:1.35}

/* detalle */
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--accent);font:500 17px var(--font-ui);padding:8px 0;margin-left:-6px;cursor:pointer;justify-self:start}
.cols{display:grid;gap:10px}
.col{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.col-n{font:400 28px/1 var(--font-truth);color:var(--muted)}
.col h3{margin:0;font:600 13px/1.3 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.col-b{display:grid;gap:10px;min-width:0;overflow-wrap:anywhere}
.col .old{color:var(--old);font-size:19px;line-height:1.4}
.col .none{color:var(--muted);font-style:italic;font-size:15px}
.col-truth{background:var(--accent-soft);border-color:transparent}
.col-truth .col-n{color:var(--accent)}
.col-truth h3{color:var(--accent)}
.truth{font:400 22px/1.35 var(--font-truth)}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{font:600 14px/1.2 var(--font-ui);color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:999px;text-decoration:none}
.col-truth .ref{background:var(--surface)}
.again{display:grid;gap:10px}
.again-note{color:var(--muted);font-size:15px}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@keyframes flash{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}to{box-shadow:0 0 0 16px transparent}}
.flash{animation:flash .9s ease-out}

/* verdades */
.truths{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.truths > li{display:grid;gap:10px;padding:16px;border-left:4px solid var(--accent)}
.truths > li + li{border-top:1px solid var(--line)}
.truths.guide > li{border-left-color:var(--line)}
.truth-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:15px}
.truth-meta .link{font-size:15px}
.truths .truth{font-size:20px}

/* enviar */
.seg{border:0;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;font-weight:500;cursor:pointer;min-height:52px}
.opt input{accent-color:var(--accent);width:20px;height:20px;margin:0;flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:disabled){opacity:.5;cursor:default}
.send-sum{font-size:16px}
.send-sum strong{font-variant-numeric:tabular-nums}
.preview{white-space:pre-wrap;font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:320px;overflow:auto;margin:0;overflow-wrap:anywhere}
.stack{display:grid;gap:10px}
.muted{color:var(--muted);font-size:15px}

/* ajustes */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.panel h2{margin:0;font:600 19px/1.25 var(--font-ui)}
.panel.urgent{border-left:4px solid var(--danger)}
.fld{display:grid;gap:6px}
.fld > span{font:600 14px/1.3 var(--font-ui);color:var(--muted)}
input[type=text],input[type=tel],input[type=search],input[type=datetime-local],select,textarea{font:17px/1.4 var(--font-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent)}
.lines{list-style:none;margin:0;padding:0;display:grid}
.lines li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.lines li:first-child{border-top:0}
.lines a{font:700 17px/1 var(--font-ui);white-space:nowrap;text-decoration:none;font-variant-numeric:tabular-nums}
.steps-ol{margin:0;padding-left:22px;display:grid;gap:8px;font-size:16px}
.foot{color:var(--muted);font-size:13px;text-align:center}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;color:var(--muted);text-decoration:none;font:600 11px/1.2 var(--font-ui)}
.tabbar a[aria-current="page"]{color:var(--accent)}

/* editor */
#editor{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
body.editing #editor{display:block}
body.editing #app,body.editing .tabbar{display:none}
.ed{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.ed-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:48px}
.ed-top .link{text-decoration:none;justify-self:start;font-weight:500;font-size:17px;padding:8px 0}
.ed-title{font-weight:600}
.ed-count{justify-self:end;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{display:flex;flex-direction:column;gap:6px;width:100%;padding:4px 0;background:none;border:0;text-align:left;color:var(--muted);font:600 12px/1.2 var(--font-ui);cursor:pointer;overflow-wrap:anywhere}
.steps .bar{height:5px;border-radius:3px;background:var(--line)}
.steps .done .bar{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.steps .cur{color:var(--ink)}
.steps .cur .bar{background:var(--accent)}
.ed-step{display:grid;gap:12px}
.ed-n{font:400 56px/1 var(--font-truth);color:var(--accent)}
.ed-step h2{margin:0;font:700 26px/1.15 var(--font-ui);letter-spacing:-.01em;text-wrap:balance}
.ed-step h2:focus{outline:none}
.help{color:var(--muted);font-size:16px;max-width:60ch}
.help-sm{color:var(--muted);font-size:15px}
textarea{min-height:150px;resize:vertical;line-height:1.45}
textarea.truth-in{font-family:var(--font-truth);font-size:20px}
.err{color:var(--danger);font-weight:600;font-size:15px}
.err:empty{display:none}
.ed-nav{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.note{background:var(--accent-soft);padding:10px 14px;border-radius:12px;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.read-links{display:grid;gap:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.read-h{display:flex;align-items:center;gap:6px;font:600 14px/1.3 var(--font-ui);color:var(--muted)}
.read-h svg{width:18px;height:18px}
.read-links .ref{font-size:15px;padding:10px 14px}
.themes{border-top:1px solid var(--line)}
.themes details{border-bottom:1px solid var(--line)}
.themes summary{list-style:none;cursor:pointer;padding:13px 2px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:12px}
.themes summary::-webkit-details-marker{display:none}
.themes summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
.themes details[open] summary::after{content:"–"}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px}
.chip{font:500 15px/1.2 var(--font-ui);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.recap{display:grid;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.recap .ex-l{margin-bottom:2px}
.recap .old{color:var(--old);padding-left:10px;border-left:2px dotted var(--old)}

/* modal y aviso breve */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(8,14,12,.45);display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:520px;display:grid;gap:14px;max-height:85vh;overflow:auto}
.modal h2{margin:0;font:700 20px/1.25 var(--font-ui)}
.modal textarea{min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:70;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font:500 15px/1.35 var(--font-ui);width:max-content;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.editing #toast{bottom:calc(24px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion: reduce){
  .flash{animation:none}
  #toast{transition:none}
}
</style>
</head>
<body>

</nav>
<div id="editor" aria-label="Nuevo registro"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ---------- datos fijos de la guía ---------- */
const STEPS = [
  { n: 1, key: 'situacion', short: 'Situación', title: 'La situación',
    help: '¿Qué pasó? ¿Dónde estabas, con quién y a qué hora?',
    ph: 'Ej.: Mi jefa revisó mi informe y no dijo nada.' },
  { n: 2, key: 'pensamiento', short: 'Pensamiento', title: 'El pensamiento que apareció',
    help: '¿Qué te dijiste por dentro? Escríbelo tal como lo pensaste, sin suavizarlo.',
    ph: 'Ej.: «No valgo», «me van a abandonar».' },
  { n: 3, key: 'palabra', short: 'Palabra', title: 'Lo que dice la Palabra',
    help: '¿Qué dice Dios sobre eso? Anota uno o más pasajes y escribe lo que enseñan, con tus palabras o copiándolo de tu Biblia.',
    ph: 'Ej.: En Cristo no hay condenación para mí; soy una nueva criatura.' },
  { n: 4, key: 'verdad', short: 'Verdad', title: 'El pensamiento verdadero',
    help: '¿Con qué verdad reemplazas ese pensamiento? Escríbela en primera persona, tal como te la vas a decir la próxima vez que vuelva.',
    ph: 'Ej.: Mi valor no depende de lo que opine mi jefa. En Cristo soy aceptado, y puedo preguntarle con calma qué mejorar.' }
];

try { localStorage.setItem('renovar.prueba', '1'); localStorage.removeItem('renovar.prueba'); } catch (e) { storageOK = false; }
function load(k, def) {
  if (storageOK) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { storageOK = false; } }
  return k in mem ? mem[k] : def;
}
function save(k, v) {
  mem[k] = v;
  if (!storageOK) return;
  try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { storageOK = false; }
}

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
const unquote = s => String(s || '').trim().replace(/^[«"“'‘]+/, '').replace(/[»"”'’]+$/, '').trim();
const quote = s => '«' + unquote(s) + '»';
const byId = id => entries.find(e => e.id === id);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

const fDay = new Intl.DateTimeFormat('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
const fTime = new Intl.DateTimeFormat('es-CL', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fShort = new Intl.DateTimeFormat('es-CL', { day: 'numeric', month: 'short' });
const fNarrow = new Intl.DateTimeFormat('es-CL', { weekday: 'narrow' });
function dayKey(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayLabel(d) {
  const k = dayKey(d), t = new Date();
  if (k === dayKey(t)) return 'Hoy';
  const y = new Date(t); y.setDate(t.getDate() - 1);
  if (k === dayKey(y)) return 'Ayer';
  return cap(fDay.format(new Date(d)));
}
const timeLabel = d => fTime.format(new Date(d));
function whenLabel(d) {
  const l = dayLabel(d);
  return (l === 'Hoy' || l === 'Ayer' ? l.toLowerCase() : 'el ' + fDay.format(new Date(d))) + ' a las ' + timeLabel(d);
}
function toLocalInput(iso) { const d = iso ? new Date(iso) : new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
function fromLocalInput(v) { const d = new Date(v); return isNaN(d) ? new Date().toISOString() : d.toISOString(); }

function splitRefs(s) { return String(s || '').split(';').map(x => x.trim()).filter(Boolean); }
// Convierte «Romanos 8:28-29, 31» en { libro: 'ROM', cap: 8, v1: 28, v2: 29 }. Devuelve null si no lo reconoce.
function parseRef(ref) {
  const r = norm(ref).replace(/([a-z])\./g, '$1').replace(/[–—]/g, '-').replace(/\s+/g, ' ').trim();
  const m = r.match(/^((?:[123]\s?)?[a-z]+(?: de los [a-z]+)?)\s*(\d+)(?:\s*[:.]\s*(\d+)(?:\s*-\s*(\d+))?)?/);
  if (!m) return null;
  const nombre = m[1].replace(/^([123])\s?/, '$1 ');
  const libro = LIBROS[nombre] || LIBROS[nombre.replace(' ', '')];
  if (!libro) return null;
  const cap = +m[2], v1 = m[3] ? +m[3] : null, v2 = m[4] && m[3] ? +m[4] : null;
  return { libro: libro, cap: cap, v1: v1, v2: v2 && v2 > v1 ? v2 : null };
}
function versionActual() { return VERSIONES.find(v => v[0] === settings.version) || VERSIONES[0]; }
// Enlace a bible.com en español, en la versión elegida.
function webUrl(ref) {
  const p = parseRef(ref), ver = versionActual();
  if (!p) return 'https://www.bible.com/es/search/bible?q=' + encodeURIComponent(ref) + '&version_id=' + ver[2];
  const pasaje = p.libro + '.' + p.cap + (p.v1 ? '.' + p.v1 + (p.v2 ? '-' + p.v2 : '') : '');
  return 'https://www.bible.com/es/bible/' + ver[2] + '/' + pasaje + '.' + ver[0];
}
// Enlace que abre la app Biblia (YouVersion) en el pasaje.
function appUrl(ref) {
  const p = parseRef(ref); if (!p) return null;
  let refs = p.libro + '.' + p.cap;
  if (p.v1) { const vs = []; for (let v = p.v1; v <= (p.v2 || p.v1) && vs.length < 60; v++) vs.push(p.libro + '.' + p.cap + '.' + v); refs = vs.join('+'); }
  return 'youversion://bible?reference=' + refs;
}
function bibleAttrs(ref) { return 'href="' + esc(webUrl(ref)) + '" data-bible="' + esc(ref) + '" target="_blank" rel="noopener"'; }
function refLinks(s) { return splitRefs(s).map(r => '<a class="ref" ' + bibleAttrs(r) + '>' + esc(r) + '</a>').join(''); }

function weekStrip() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(t); d.setDate(t.getDate() - i); days.push(d); }
  const today = dayKey(new Date());
  let total = 0, reps = 0;
  const cells = days.map(d => {
    const k = dayKey(d); let n = 0, r = 0;
    entries.forEach(e => { if (dayKey(e.fecha) === k) n++; (e.reps || []).forEach(x => { if (dayKey(x) === k) r++; }); });
    total += n; reps += r;
    const label = cap(fDay.format(d)) + ': ' + plural(n, 'registro', 'registros') + ', ' + plural(r, 'vez', 'veces') + ' volviste a la verdad';
    return '<li class="' + (n + r ? 'on ' : '') + (k === today ? 'today' : '') + '" aria-label="' + esc(label) + '"><span class="wd" aria-hidden="true">' + esc(fNarrow.format(d)) + '</span><span class="wn" aria-hidden="true">' + (n + r || '') + '</span></li>';
  }).join('');
  return '<section class="week" aria-label="Últimos 7 días"><p class="week-sum">Últimos 7 días: <strong>' + plural(total, 'registro', 'registros') + '</strong> y <strong>' + plural(reps, 'vez', 'veces') + '</strong> que volviste a la verdad</p><ol class="week-days">' + cells + '</ol></section>';
}

function rowHTML(e) {

  return '<li><button class="row" data-action="open" data-id="' + esc(e.id) + '">' +

    '</span>' +
    (n ? '<span class="row-rep" aria-label="Volvió ' + plural(n, 'vez', 'veces') + '">×' + n + '</span>' : '<span></span>') +
    ICON.chev + '</button></li>';

function groupsHTML() {
  const q = norm(state.q);
  const list = entries.filter(e => !q || norm([e.situacion, e.pensamiento, e.citas, e.palabra, e.verdad].join(' ')).includes(q))
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!list.length) return '<p class="empty">No hay registros que coincidan con «' + esc(state.q) + '».</p>';
  const groups = []; let cur = null;
  list.forEach(e => { const k = dayKey(e.fecha); if (!cur || cur.k !== k) { cur = { k: k, label: dayLabel(e.fecha), items: [] }; groups.push(cur); } cur.items.push(e); });
  return groups.map(g => '<section class="group"><h2 class="group-h">' + esc(g.label) + '</h2><ul class="rows">' + g.items.map(rowHTML).join('') + '</ul></section>').join('');
}

  return h;
}

function col(n, title, body, extra) {

function viewVerdades() {

  h += '<section><h2 class="sec-h">De mis registros</h2>';

    h += '<ul class="truths">' + mine.map(e => '<li><p class="truth">' + nl(e.verdad) + '</p><div class="truth-meta">' + (e.citas ? '<div class="refs">' + refLinks(e.citas) + '</div>' : '') + '<button class="link" data-action="open" data-id="' + esc(e.id) + '">Ver registro</button></div></li>').join('') + '</ul>';

function rangeInfo(range) {
  const now = new Date();
  if (range === 'todo') return { from: null, label: 'Todos los registros' };
  if (range === 'ultimo' && settings.lastSent) return { from: new Date(settings.lastSent), byUpdate: true, label: 'Desde el último envío (' + fShort.format(new Date(settings.lastSent)) + ')' };
  const days = range === '30' ? 30 : 7;
  const from = new Date(now); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - (days - 1));
  return { from: from, label: 'Últimos ' + days + ' días (' + fShort.format(from) + ' – ' + fShort.format(now) + ')' };
}
function entriesInRange(range) {
  const r = rangeInfo(range);
  return entries.filter(e => {
    if (!r.from) return true;
    if (r.byUpdate) return new Date(e.actualizado || e.fecha) > r.from;
    return new Date(e.fecha) >= r.from || (e.reps || []).some(x => new Date(x) >= r.from);
  });
}
function buildReport(range) {
  const list = entriesInRange(range).slice().sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
  const L = ['SELF-TALK LOG'];
  const who = [settings.nombre ? 'De: ' + settings.nombre : '', settings.consejeroNombre ? 'Para: ' + settings.consejeroNombre : ''].filter(Boolean).join(' · ');
  if (who) L.push(who);
  L.push(rangeInfo(range).label + ' · ' + plural(list.length, 'registro', 'registros'));
  if (!list.length) { L.push('', '(No hay registros en este período.)'); return L.join('\n'); }
  list.forEach((e, i) => {
    L.push('', '— ' + (i + 1) + '. ' + cap(fDay.format(new Date(e.fecha))) + ', ' + timeLabel(e.fecha) + ' —');
    L.push('1. Situación: ' + (e.situacion ? e.situacion.trim() : '—'));
    L.push('2. Pensamiento que apareció: ' + quote(e.pensamiento));
    const w = [e.citas ? '(' + e.citas.trim() + ')' : '', e.palabra ? e.palabra.trim() : ''].filter(Boolean).join(' ');
    L.push('3. Lo que dice la Palabra: ' + (w || '—'));
    L.push('4. Pensamiento verdadero: ' + (e.verdad ? e.verdad.trim() : '—'));
    const n = (e.reps || []).length;
    if (n) L.push('Volvió ' + plural(n, 'vez', 'veces') + '.');
  });
  return L.join('\n');
}

/* ---------- editor de 4 pasos ---------- */
function blankDraft() { return { fecha: new Date().toISOString(), situacion: '', pensamiento: '', citas: '', palabra: '', verdad: '' }; }
function hasContent(d) { return d && ['situacion', 'pensamiento', 'citas', 'palabra', 'verdad'].some(k => (d[k] || '').trim()); }
function stepFilled(d, s) { return s.n === 3 ? !!((d.citas || '').trim() || (d.palabra || '').trim()) : !!(d[s.key] || '').trim(); }

function openNew() {
  const dr = load(K_DRAFT, null);
  const restored = hasContent(dr);
  state.editor = { step: 1, id: null, data: restored ? Object.assign(blankDraft(), dr) : blankDraft(), restored: restored, dirty: false };
  showEditor();
}
function openEdit(id, step) {
  const e = byId(id); if (!e) return;
  state.editor = { step: step || 1, id: id, data: { fecha: e.fecha, situacion: e.situacion || '', pensamiento: e.pensamiento || '', citas: e.citas || '', palabra: e.palabra || '', verdad: e.verdad || '' }, restored: false, dirty: false };
  showEditor();
}
function showEditor() {
  document.body.classList.add('editing');
  $('#editor').setAttribute('aria-label', state.editor.id ? 'Editar registro' : 'Nuevo registro');
  renderEditor();
}
function closeEditor() {
  document.body.classList.remove('editing');
  $('#editor').innerHTML = '';
  state.editor = null;
  render();
}

function fieldTA(s, d, cls) {
  return '<label class="sr-only" for="f-' + s.key + '">' + esc(s.title) + '</label><textarea id="f-' + s.key + '" data-field="' + s.key + '" class="' + (cls || '') + '" placeholder="' + esc(s.ph) + '" rows="5">' + esc(d[s.key] || '') + '</textarea>';
}
function themesHTML(d) {
  const have = new Set(splitRefs(d.citas).map(norm));
  return '<div class="themes"><p class="sec-h" style="margin:14px 0 2px">Pasajes por tema</p>' + TEMAS.map(([t, refs]) => '<details><summary>' + esc(t) + '</summary><div class="chips">' +
    refs.map(r => '<button type="button" class="chip' + (have.has(norm(r)) ? ' on' : '') + '" data-action="add-ref" data-ref="' + esc(r) + '" aria-pressed="' + (have.has(norm(r)) ? 'true' : 'false') + '">' + esc(r) + '</button>').join('') +
    '</div></details>').join('') + '</div>';
}
function stepFields(s, d) {
  if (s.n === 1) {
    return '<label class="fld" for="f-fecha"><span>¿Cuándo pasó?</span><input id="f-fecha" type="datetime-local" data-field="fecha" value="' + toLocalInput(d.fecha) + '"></label>' + fieldTA(s, d);
  }
  if (s.n === 2) {
    return fieldTA(s, d) + '<p class="help-sm">Si el pensamiento es de no querer vivir o de hacerte daño, no lo guardes solo aquí. <button class="link" data-action="help">Ver ayuda urgente</button></p>';
  }
  if (s.n === 3) {
    return '<label class="fld" for="f-citas"><span>Pasajes</span><input id="f-citas" type="text" data-field="citas" placeholder="Ej.: Romanos 8:1; 2 Corintios 5:17" value="' + esc(d.citas) + '" autocomplete="off"></label>' +
      '<div id="read-links" class="read-links' + (splitRefs(d.citas).length ? '' : ' hidden') + '"><p class="read-h">' + ICON.book + '<span>Leer en la Biblia (toca cada pasaje)</span></p><div class="refs">' + refLinks(d.citas) + '</div></div>' +
      '<label class="fld" for="f-palabra"><span>Lo que dice</span></label>' + fieldTA(s, d).replace('<label class="sr-only" for="f-palabra">' + esc(s.title) + '</label>', '') +
      themesHTML(d);
  }
  const recap = (d.pensamiento || '').trim() ? '<div class="recap"><p><span class="ex-l">El pensamiento que apareció</span><span class="old">' + nl(quote(d.pensamiento)) + '</span></p>' +
    (((d.citas || '').trim() || (d.palabra || '').trim()) ? '<p><span class="ex-l">Lo que dice la Palabra' + (d.citas ? ' · ' + esc(d.citas) : '') + '</span>' + nl(d.palabra || '') + '</p>' : '') + '</div>' : '';
  return recap + fieldTA(s, d, 'truth-in');
}

function renderEditor() {
  const ed = state.editor, s = STEPS[ed.step - 1], d = ed.data;
  $('#editor').innerHTML = '<div class="ed">' +
    '<header class="ed-top"><button class="link" data-action="ed-cancel">Cancelar</button><p class="ed-title">' + (ed.id ? 'Editar registro' : 'Nuevo registro') + '</p><p class="ed-count">Paso ' + ed.step + ' de 4</p></header>' +
    '<ol class="steps" aria-label="Pasos">' + STEPS.map(x => '<li><button type="button" data-action="ed-go" data-step="' + x.n + '" class="' + (x.n === ed.step ? 'cur ' : '') + (stepFilled(d, x) ? 'done' : '') + '"' + (x.n === ed.step ? ' aria-current="step"' : '') + '><span class="bar"></span><span>' + x.short + '</span></button></li>').join('') + '</ol>' +
    (ed.restored && ed.step === 1 ? '<p class="note">Recuperamos el borrador que dejaste a medias. <button class="link" data-action="ed-reset">Empezar de cero</button></p>' : '') +
    '<section class="ed-step"><p class="ed-n" aria-hidden="true">' + s.n + '</p><h2 id="ed-h" tabindex="-1">' + s.title + '</h2><p class="help">' + s.help + '</p>' + stepFields(s, d) + '<p class="err" id="ed-err" role="alert"></p></section>' +
    '<div class="ed-nav">' + (ed.step > 1 ? '<button class="btn btn-ghost" data-action="ed-prev">Atrás</button>' : '<span></span>') +
    (ed.step < 4 ? '<button class="btn btn-primary" data-action="ed-next">Siguiente</button>' : '<button class="btn btn-primary" data-action="ed-save">Guardar registro</button>') + '</div>' +
    '</div>';
  document.querySelectorAll('#editor textarea').forEach(grow);
  $('#editor').scrollTop = 0;
}
function grow(t) { t.style.height = 'auto'; t.style.height = Math.max(150, t.scrollHeight + 2) + 'px'; }
function setErr(m) { const el = $('#ed-err'); if (el) el.textContent = m; }

function goStep(n) {
  state.editor.step = Math.min(4, Math.max(1, n));
  renderEditor();
  const h = $('#ed-h'); if (h) h.focus({ preventScroll: true });
}

function saveEntry() {
  const ed = state.editor, d = ed.data;
  if (!(d.pensamiento || '').trim()) { goStep(2); setErr('Escribe el pensamiento que apareció para poder guardar el registro.'); return; }
  const now = new Date().toISOString();
  const clean = { fecha: d.fecha || now, situacion: (d.situacion || '').trim(), pensamiento: (d.pensamiento || '').trim(), citas: (d.citas || '').trim().replace(/;\s*$/, ''), palabra: (d.palabra || '').trim(), verdad: (d.verdad || '').trim() };
  let id = ed.id;
  if (id) { Object.assign(byId(id), clean, { actualizado: now }); }
  else { id = uid(); entries.push(Object.assign({ id: id, creado: now, actualizado: now, reps: [] }, clean)); save(K_DRAFT, null); }
  persist();
  const wasNew = !ed.id;
  state.tab = state.tab === 'verdades' ? 'verdades' : 'registros';
  state.view = 'detalle'; state.id = id;
  closeEditor();
  window.scrollTo(0, 0);
  toast(wasNew ? (clean.verdad ? 'Guardado. Repite la verdad cada vez que el pensamiento vuelva.' : 'Guardado. Completa el paso 4 cuando puedas.') : 'Cambios guardados.');
}

function addRef(ref) {
  const d = state.editor.data;
  const refs = splitRefs(d.citas);
  const i = refs.map(norm).indexOf(norm(ref));
  if (i >= 0) refs.splice(i, 1); else refs.push(ref);
  d.citas = refs.join('; ');
  state.editor.dirty = true;
  if (!state.editor.id) save(K_DRAFT, d);
  const inp = $('#f-citas'); if (inp) inp.value = d.citas;
  document.querySelectorAll('#editor .chip').forEach(c => { const on = refs.map(norm).includes(norm(c.dataset.ref)); c.classList.toggle('on', on); c.setAttribute('aria-pressed', on ? 'true' : 'false'); });
  updateReadLink();
}
function updateReadLink() {
  const box = $('#read-links'); if (!box) return;
  const refs = splitRefs(state.editor.data.citas);
  box.classList.toggle('hidden', !refs.length);
  box.querySelector('.refs').innerHTML = refLinks(state.editor.data.citas);
}

/* ---------- modal y aviso breve ---------- */
let modalResolve = null;
function modal(title, bodyHTML, actions) {
  return new Promise(res => {
    modalResolve = res;
    $('#modal').innerHTML = '<div class="modal-bg" data-modal="__bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h"><h2 id="m-h">' + esc(title) + '</h2>' + bodyHTML +
      '<div class="stack">' + actions.map(a => '<button class="btn ' + (a.cls || 'btn-ghost') + '" data-modal="' + a.key + '">' + esc(a.label) + '</button>').join('') + '</div></div></div>';
    const first = $('#modal [data-modal]:not(.modal-bg)'); if (first) first.focus();
  });
}
function closeModal(key) { $('#modal').innerHTML = ''; if (modalResolve) { const r = modalResolve; modalResolve = null; r(key); } }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- enviar, copiar, respaldo ---------- */
function legacyCopy(text) {
  try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { return legacyCopy(text); }
}
function markSent() { settings.lastSent = new Date().toISOString(); saveSettings(); state.range = 'ultimo'; }
async function doShare() {
  const text = buildReport(state.range);
  try { await navigator.share({ title: 'Self-Talk Log', text: text }); markSent(); render(); toast('Listo. La próxima vez, «Desde el último envío» empezará aquí.'); }
  catch (err) { if (err && err.name === 'AbortError') return; doCopy(); }
}
async function doCopy() {
  const text = buildReport(state.range);
  if (await copyText(text)) { markSent(); render(); toast('Texto copiado. Pégalo en WhatsApp o en un correo para tu consejero.'); }
  else toast('No se pudo copiar. Mantén presionado el texto para seleccionarlo.');
}

function backupJSON() { return JSON.stringify({ app: 'renovar', formato: 1, exportado: new Date().toISOString(), registros: entries, ajustes: { nombre: settings.nombre, consejeroNombre: settings.consejeroNombre, consejeroTel: settings.consejeroTel, version: settings.version } }, null, 2); }
function markBackup() { settings.lastBackup = new Date().toISOString(); saveSettings(); }
async function doBackup() {
  const json = backupJSON();
  const name = 'renovar-copia-' + dayKey(new Date()) + '.json';
  if (!inFrame) {
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Copia de seguridad de Renovando Tu Mente' });
        markBackup(); render(); toast('Copia guardada.'); return;
      }
      const url = URL.createObjectURL(file);
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      markBackup(); render(); toast('Copia descargada en Archivos.'); return;
    } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  const k = await modal('Copia de seguridad', '<p class="muted">Copia este texto y guárdalo en una nota o envíatelo por correo. Para restaurar, guárdalo como archivo .json.</p><textarea id="m-json" readonly>' + esc(json) + '</textarea>', [{ key: 'copy', label: 'Copiar', cls: 'btn-primary' }, { key: 'close', label: 'Cerrar' }]);
  if (k === 'copy') { if (await copyText(json)) { markBackup(); render(); toast('Copia copiada.'); } else toast('No se pudo copiar.'); }
}
function sanitize(x) {
  const s = v => typeof v === 'string' ? v : '';
  const okDate = v => { const d = new Date(v); return isNaN(d) ? null : d.toISOString(); };
  return { id: s(x.id) || uid(), fecha: okDate(x.fecha) || new Date().toISOString(), creado: okDate(x.creado) || new Date().toISOString(), actualizado: okDate(x.actualizado) || new Date().toISOString(),
    situacion: s(x.situacion), pensamiento: s(x.pensamiento), citas: s(x.citas), palabra: s(x.palabra), verdad: s(x.verdad), reps: Array.isArray(x.reps) ? x.reps.map(okDate).filter(Boolean) : [] };
}
function restoreFrom(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('Ese archivo no es una copia de Renovando Tu Mente.'); return; }
  const list = data && (data.registros || data.entries);
  if (!Array.isArray(list)) { toast('Ese archivo no es una copia de Renovando Tu Mente.'); return; }
  let added = 0, updated = 0;
  list.forEach(x => {
    if (!x || (!x.pensamiento && !x.situacion)) return;
    const y = sanitize(x); const cur = byId(y.id);
    if (!cur) { entries.push(y); added++; }
    else if (y.actualizado > (cur.actualizado || '')) { Object.assign(cur, y); updated++; }
  });
  const a = data.ajustes || {};
  ['nombre', 'consejeroNombre', 'consejeroTel', 'version'].forEach(k => { if (!settings[k] && typeof a[k] === 'string') settings[k] = a[k]; });
  persist(); saveSettings(); render();
  toast('Restaurado: ' + plural(added, 'registro nuevo', 'registros nuevos') + (updated ? ' y ' + plural(updated, 'actualizado', 'actualizados') : '') + '.');
}

/* ---------- abrir pasajes: app Biblia (YouVersion) o bible.com ---------- */
const isAndroid = /Android/i.test(navigator.userAgent);
function openWeb(url) {
  const w = window.open(url, '_blank');
  if (w) { try { w.opener = null; } catch (e) {} } else { location.href = url; }
}
function openInApp(ref) {
  const app = appUrl(ref), web = webUrl(ref);
  if (!app) { openWeb(web); return; }
  if (isAndroid) {
    // Android abre la app y, si no está instalada, el propio sistema abre bible.com.
    location.href = 'intent://' + app.replace('youversion://', '') + '#Intent;scheme=youversion;package=com.sirma.mobile.bible.android;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
    return;
  }
  // iPhone: si la app se abre, esta página pasa a segundo plano. Si no pasa nada, se abre bible.com.
  let salio = false;
  const marcar = () => { salio = true; };
  const vis = () => { if (document.hidden) salio = true; };
  document.addEventListener('visibilitychange', vis);
  window.addEventListener('pagehide', marcar);
  window.addEventListener('blur', marcar);
  location.href = app;
  setTimeout(() => {
    document.removeEventListener('visibilitychange', vis);
    window.removeEventListener('pagehide', marcar);
    window.removeEventListener('blur', marcar);
    if (salio || document.hidden) return;
    settings.biblia = 'web'; saveSettings();
    toast('No encontramos la app Biblia, así que abrimos bible.com. Si la instalas, cámbialo en Ajustes.');
    openWeb(web);
  }, 1800);
}
async function openBible(ref, ev) {
  if (!ref) return;
  const movil = isIOS || isAndroid;
  if (!movil || inFrame) return; // computador o vista previa: el enlace normal abre bible.com
  ev.preventDefault();
  if (settings.biblia === 'web') { openWeb(webUrl(ref)); return; }
  if (settings.biblia === 'app') { openInApp(ref); return; }
  const k = await modal('¿Tienes la app Biblia?', '<p class="muted">Si tienes instalada la app Biblia (YouVersion), los pasajes se abren ahí. Si no, se abren en bible.com. Te lo preguntamos solo esta vez; puedes cambiarlo en Ajustes.</p>',
    [{ key: 'app', label: 'Sí, abrir en la app Biblia', cls: 'btn-primary' }, { key: 'web', label: 'No, abrir en bible.com' }]);
  if (k !== 'app' && k !== 'web') return;
  settings.biblia = k; saveSettings();
  if (k === 'app') openInApp(ref); else openWeb(webUrl(ref));
}

/* ---------- navegación ---------- */
function goTab(tab, push) {
  if (!TABS.includes(tab)) tab = 'registros';
  state.tab = tab; state.view = 'tab';
  if (push && location.hash !== '#' + tab) { try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; } }
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h)) goTab(h); });

document.addEventListener('click', async ev => {
  const m = ev.target.closest('[data-modal]');
  if (m) { if (m.dataset.modal === '__bg' && ev.target !== m) return; closeModal(m.dataset.modal); return; }
  const bl = ev.target.closest('a[data-bible]');
  if (bl) { openBible(bl.dataset.bible, ev); return; }
  const tabA = ev.target.closest('.tabbar a');
  if (tabA) { ev.preventDefault(); goTab(tabA.dataset.tab, true); return; }
  const b = ev.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  switch (a) {
    case 'new': openNew(); break;
    case 'open': state.view = 'detalle'; state.id = id; render(); window.scrollTo(0, 0); break;
    case 'back': state.view = 'tab'; render(); window.scrollTo(0, 0); break;
    case 'edit': openEdit(id); break;
    case 'again': {
      const e = byId(id); if (!e) break;
      e.reps = e.reps || []; e.reps.push(new Date().toISOString()); e.actualizado = new Date().toISOString();
      persist(); render();
      const tc = document.querySelector('.col-truth'); if (tc) { tc.classList.remove('flash'); void tc.offsetWidth; tc.classList.add('flash'); }
      toast(e.verdad ? 'Anotado. Dite otra vez la verdad, despacio.' : 'Anotado. Cuando puedas, escribe la verdad en el paso 4.');
      break;
    }
    case 'delete': {
      const k = await modal('¿Eliminar este registro?', '<p class="muted">No se puede deshacer.</p>', [{ key: 'del', label: 'Eliminar', cls: 'btn-primary' }, { key: 'no', label: 'Cancelar' }]);
      if (k === 'del') { entries = entries.filter(e => e.id !== id); persist(); state.view = 'tab'; render(); toast('Registro eliminado.'); }
      break;
    }
    case 'ed-next': goStep(state.editor.step + 1); break;
    case 'ed-prev': goStep(state.editor.step - 1); break;
    case 'ed-go': goStep(+b.dataset.step); break;
    case 'ed-save': saveEntry(); break;
    case 'ed-reset': state.editor.data = blankDraft(); state.editor.restored = false; save(K_DRAFT, null); renderEditor(); break;
    case 'ed-cancel': {
      const ed = state.editor;
      if (ed.id && ed.dirty) {
        const k = await modal('¿Descartar los cambios?', '<p class="muted">El registro quedará como estaba.</p>', [{ key: 'ok', label: 'Descartar cambios', cls: 'btn-primary' }, { key: 'no', label: 'Seguir editando' }]);
        if (k !== 'ok') break;
      }
      const hadDraft = !ed.id && hasContent(ed.data);
      closeEditor();
      if (hadDraft) toast('Guardamos tu borrador para que lo termines después.');
      break;
    }
    case 'add-ref': addRef(b.dataset.ref); break;
    case 'help': await modal('Ayuda urgente', helpHTML(), [{ key: 'close', label: 'Volver', cls: 'btn-primary' }]); break;
    case 'share': doShare(); break;
    case 'copy': doCopy(); break;
    case 'backup': doBackup(); break;
    case 'go-install': goTab('ajustes', true); setTimeout(() => { const el = $('#instalar'); if (el) el.scrollIntoView(); }, 0); break;
    case 'hide-install': settings.installHidden = true; saveSettings(); render(); break;
    case 'wipe': {
      const k = await modal('¿Borrar todos los registros?', '<p class="muted">Se borrarán ' + plural(entries.length, 'registro', 'registros') + ' de este teléfono. Si quieres conservarlos, guarda antes una copia de seguridad.</p>', [{ key: 'del', label: 'Borrar todo', cls: 'btn-primary' }, { key: 'no', label: 'Cancelar' }]);
      if (k === 'del') { entries = []; persist(); save(K_DRAFT, null); render(); toast('Se borraron todos los registros.'); }
      break;
    }
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.field && state.editor) {
    const k = t.dataset.field;
    state.editor.data[k] = k === 'fecha' ? (t.value ? fromLocalInput(t.value) : new Date().toISOString()) : t.value;
    state.editor.dirty = true;
    if (!state.editor.id) save(K_DRAFT, state.editor.data);
    if (t.tagName === 'TEXTAREA') grow(t);
    if (k === 'citas') updateReadLink();
    setErr('');
    return;
  }
  if (t.dataset.setting) {
    settings[t.dataset.setting] = t.value;
    if (t.dataset.setting === 'consejeroNombre' || t.dataset.setting === 'consejeroTel') settings.consejeroEditado = true;
    saveSettings();
    const r = $('#report'); if (r) r.textContent = buildReport(state.range);
    return;
  }
  if (t.id === 'q') { state.q = t.value; const g = $('#groups'); if (g) g.innerHTML = groupsHTML(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.name === 'range') { state.range = t.value; render(); return; }
  if (t.id === 'restore-file' && t.files && t.files[0]) {
    const fr = new FileReader(); fr.onload = () => restoreFrom(String(fr.result)); fr.readAsText(t.files[0]); t.value = '';
    return;
  }
  if (t.dataset.setting && t.tagName === 'SELECT') { settings[t.dataset.setting] = t.value; if (t.dataset.setting === 'version') settings.versionElegida = true; saveSettings(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal').innerHTML) closeModal('__esc'); });

/* ---------- inicio ---------- */
const h0 = location.hash.slice(1);
state.tab = TABS.includes(h0) ? h0 : 'registros';
render();

if (!inFrame) {
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
})();
</script>
